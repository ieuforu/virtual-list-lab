<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Virtual List Lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
        gap: 16px;
      }
      .panel {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 20px;
        width: 100%;
        max-width: 680px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .telemetry {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        background: #0f172a;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        font-size: 13px;
      }
      .telemetry-item div:first-child {
        color: #94a3b8;
        font-size: 11px;
      }
      .telemetry-item div:last-child {
        font-weight: bold;
        color: #38bdf8;
        margin-top: 2px;
      }
      /* 视口外壳 */
      #viewport {
        position: relative;
        width: 100%;
        height: 520px;
        overflow-y: auto;
        background: #090d16;
        border: 1px solid #334155;
        border-radius: 6px;
        will-change: transform;
      }
      /* 撑开滚动条的幽灵占位层 */
      #phantom {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        z-index: -1;
      }
      /* 容纳复用 DOM 节点的真实容器 */
      #content-box {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        pointer-events: none;
      }
      /* 池化节点样式 */
      .list-item {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
        background: #131c2e;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: auto;
        box-sizing: border-box;
      }
      .list-item-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #38bdf8;
      }
      .list-item-desc {
        font-size: 13px;
        color: #cbd5e1;
        line-height: 1.5;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>万级不定高动态虚拟滚动（100,000 数据条目）</h2>
      <div class="telemetry">
        <div class="telemetry-item">
          <div>总数据量</div>
          <div id="stat-total">100,000 条</div>
        </div>
        <div class="telemetry-item">
          <div>DOM 真实节点数</div>
          <div id="stat-dom-count">0</div>
        </div>
        <div class="telemetry-item">
          <div>当前渲染区间</div>
          <div id="stat-range">[0, 0]</div>
        </div>
        <div class="telemetry-item">
          <div>滚动条物理总高</div>
          <div id="stat-phantom-height">0 px</div>
        </div>
      </div>

      <div id="viewport">
        <div id="phantom"></div>
        <div id="content-box"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
